name: CI & Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Run Full Test Suite (OCR + Solver + Gameplay)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR Accuracy Benchmark (92 Samples)
        run: |
          python test_accuracy.py

      - name: Run Solver & Custom Traps Unit Tests
        run: |
          python test_solver.py

      - name: Run Gameplay Indexer Sequence Tests
        run: |
          python test_gameplay_indexer.py
