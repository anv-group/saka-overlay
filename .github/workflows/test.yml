name: CI & Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Run Test Suite (Compile + Solver + DB Sync + System)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Check (Python Syntax)
        run: |
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in sorted(glob.glob('*.py'))]"

      - name: Run Unit Tests (Solver, DB Sync, System & Updater)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test_solver test_db_sync test_system_features -v

      - name: Run OCR Accuracy Benchmark (if sample dataset exists)
        if: hashFiles('sample/**') != ''
        run: |
          python test_accuracy.py
